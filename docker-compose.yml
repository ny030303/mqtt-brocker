version: '3.8'

services:
  ipfs:
    image: ipfs/go-ipfs:latest
    container_name: ipfs_node
    ports:
      - "4001:4001"   # libp2p 통신 포트
      - "5001:5001"   # API 포트
      - "8080:8080"   # 게이트웨이 포트
    networks:
      - ipfs_net
    volumes:
      - ./ipfs_data:/data/ipfs
    restart: always

  uploader:
    build: ./uploader
    container_name: pinata_uploader
    depends_on:
      - ipfs
    networks:
      - ipfs_net
    environment:
      - PINATA_JWT=${PINATA_JWT}
      - FILE_PATH=/app/shared/${FILENAME}
    volumes:
      - ./uploader:/app
      - /home/ubuntu/Desktop/shared:/app/shared
    command: >
      bash -c "python /app/upload_to_pinata.py && echo Done > /app/shared/status.txt"

  jupyter_gpu:
    image: jupyter/tensorflow-notebook:latest  # GPU 지원 주피터 이미지 사용
    container_name: jupyter_gpu
    runtime: nvidia  # GPU 사용을 위한 설정 (NVIDIA Container Toolkit 필요)
    ports:
      - "8888:8888"  # 주피터 노트북 기본 포트
    volumes:
      - ./jupyter:/home/jovyan/work  # 별도의 폴더(예: ./jupyter)를 마운트
    environment:
      - JUPYTER_ENABLE_LAB=yes  # JupyterLab 환경으로 실행하려면 설정
    restart: unless-stopped
    # deploy 섹션은 Swarm 모드에서 사용 가능하므로, 일반 docker-compose에서는 runtime 설정이 주요함
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  ipfs_net:
